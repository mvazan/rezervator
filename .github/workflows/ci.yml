name: CI

# Every push and PR: analyzer + tests. Keeps main always releasable.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Android: the Gradle/AGP/Kotlin toolchain is otherwise only ever exercised
  # by release.yml, on a tag — so a toolchain that no longer builds is found
  # at the worst possible moment, with a version already tagged. A debug APK
  # needs no keystore and no secrets (the --dart-defines are runtime config)
  # and runs the whole toolchain, so it catches that here instead.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  # Backend: rebuild the database from the migrations alone, prove the
  # committed schema snapshot matches it, run the tenancy smoke-test and
  # type-check + test the Deno edge functions.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: supabase/schema.sql is a pg_dump and must come from the same
      # CLI (and bundled Postgres image) that tool/schema_snapshot.sh uses.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.0
      - name: Build the database from migrations
        run: supabase start -x studio,imgproxy,inbucket,analytics,vector,edge-runtime,storage,realtime,meta
      - name: Schema snapshot is current
        run: |
          supabase db dump --local --schema public -f /tmp/schema.sql
          diff -u supabase/schema.sql /tmp/schema.sql
      - name: Tenancy RLS smoke-test
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/tenancy_rls.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # An empty index.ts is valid TypeScript, so `deno check` is happy with
      # it — and deploy-backend ships whatever is here. That is how notify
      # went to production as a 0-byte file and stayed there for two days,
      # with the job queue and every push notification silently dead. Every
      # function must actually answer requests, so every function must serve.
      - name: Every edge function serves something
        run: |
          for f in supabase/functions/*/index.ts; do
            grep -q "Deno.serve" "$f" || { echo "$f has no Deno.serve — it would deploy dead"; exit 1; }
          done
      - name: Edge functions type-check + tests
        run: |
          deno check --import-map supabase/functions/import_map.json supabase/functions/notify/index.ts supabase/functions/cancel/index.ts supabase/functions/calendar-oauth-callback/index.ts supabase/functions/calendar-manage/index.ts supabase/functions/kiosk-password/index.ts
          deno test supabase/functions

