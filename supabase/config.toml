# Remote config pro `supabase config push` — jen sekce, které spravujeme
# (SMTP + auth URL). Heslo se bere z env(SMTP_PASS), do repa nepatří.
project_id = "wgwijvcnslkesyqgaeul"

[auth]
site_url = "https://mvazan.github.io/rezervator/"
additional_redirect_urls = [
  "cz.kuzelky.rezervator://login-callback",
  "https://mvazan.github.io/rezervator/",
  "http://localhost:**",
]

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "milos.vazan@gmail.com"
pass = "env(SMTP_PASS)"
admin_email = "milos.vazan@gmail.com"
sender_name = "Rezervátor"

# Česká šablona přihlašovacího e-mailu — obsahuje odkaz i číselný kód
# ({{ .Token }}), aby fungoval fallback „Zadat kód z e-mailu".
[auth.email.template.magic_link]
subject = "Přihlášení do Rezervátoru"
content_path = "./supabase/templates/magic_link.html"

# Edge funkce. notify a cancel se volají bez Supabase JWT — notify z Database
# Webhooks a z minutového cronu (bránou je hlavička x-webhook-secret), cancel
# podepsaným HMAC odkazem z e-mailu — proto verify_jwt = false. Import mapa
# pinuje supabase-js, aby každý deploy sbalil stejnou verzi (reprodukovatelné
# nasazení).
[functions.notify]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.cancel]
verify_jwt = false
import_map = "./functions/import_map.json"

# Google kalendář (0023). calendar-oauth-callback je cíl přesměrování z Google
# OAuth — prohlížeč k němu JWT přiložit neumí, důvěru nese jednorázový nonce
# ve `state` (start_calendar_link). calendar-manage volá přihlášený hráč přes
# functions.invoke, takže JWT ověřuje platforma ještě před spuštěním.
[functions.calendar-oauth-callback]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.calendar-manage]
verify_jwt = true
import_map = "./functions/import_map.json"
