<!DOCTYPE html>
<html lang="cs">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rezervace tréninků na kuželně.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rezervátor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rezervátor</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // The kiosk's „Nižší rozlišení“ (Správa → Kiosk → Optimalizace výkonu):
    // Flutter reads devicePixelRatio as it boots, so the kiosk stores the
    // choice (lib/core/web/kiosk_low_res_web.dart) and it is applied here,
    // before flutter_bootstrap.js. The page then draws at 1 pixel per CSS
    // pixel and the display scales it up.
    try {
      if (localStorage.getItem('rezervator.kiosk.lowRes') === '1') {
        Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });
      }
    } catch (e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
